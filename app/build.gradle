plugins {
    id("com.android.application")
}

android {
    namespace "com.example.androidpoc"
    compileSdk 36

    defaultConfig {
        applicationId "com.example.androidpoc"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0"

        // Flutter エンジンのネイティブライブラリを含めるアーキテクチャ（Flutter add-to-app の要件）。
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86_64"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        // flutter build aar が発行する flutter_profile 成果物を使うために必要
        // （Flutter の add-to-app AAR 配布方式の要件）。
        profile {
            initWith debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 注意: どのライブラリも、レイアウト XML では app:（サードパーティのカスタム属性）を使わない。
    // Java 側の API のみで利用する（詳細は各画面のコメント、および運用メモ docs/ 相当の経緯を参照）。
    implementation "androidx.appcompat:appcompat:1.7.1"
    implementation "com.google.android.material:material:1.14.0"
    implementation "androidx.fragment:fragment:1.8.9"
    implementation "androidx.recyclerview:recyclerview:1.4.0"
    implementation "androidx.security:security-crypto:1.1.0"
    implementation "com.github.bumptech.glide:glide:4.16.0"

    // Todo 確認①②画面（flutter_confirm/）の add-to-app 組み込み（AAR 配布方式）。
    // ローカル Maven リポジトリ（settings.gradle 参照）から解決される。flutter_debug/profile/release
    // の POM が shared_preferences 等のネイティブプラグインを推移的依存として含む。
    debugImplementation "com.example.flutter_confirm:flutter_debug:1.0"
    profileImplementation "com.example.flutter_confirm:flutter_profile:1.0"
    releaseImplementation "com.example.flutter_confirm:flutter_release:1.0"
}
