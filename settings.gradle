pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    // Todo の確認①②画面（flutter_confirm/）は Flutter の add-to-app・AAR 配布方式で組み込む
    // （flutter_confirm/ で `flutter build aar` を実行して生成したローカル Maven リポジトリに
    // 依存する）。ソースコード直接取り込み方式（include_flutter.groovy）は、shared_preferences
    // のようなネイティブ Android コードを持つ Flutter プラグインをホストアプリのビルドに
    // 正しく配線できない制約があるため使わない（詳細はプランファイル参照）。
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
        maven { url "$settingsDir/flutter_confirm/build/host/outputs/repo" }
        maven { url "https://storage.googleapis.com/download.flutter.io" }
    }
}

rootProject.name = "Android-POC-Flutter"
include ":app"
