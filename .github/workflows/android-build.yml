name: Android Build

# push のたびにビルドを検証する CI。
# 導入時、ローカル(Mac)で :app:processDebugResources が
# 「attribute auto:X not found」で原因不明のまま失敗し続けた。この CI で
# クリーンな Linux 環境でも同一環境（AGP/Gradle/SDK 各種の組み合わせ）で再現することを確認し、
# 環境要因ではなくプロジェクト側の問題と判明。原因はレイアウト XML で
# サードパーティ AAR のカスタム属性（app:）を使うと解決に失敗すること（Mac/Linux 双方、
# AGP 8.13.2/9.3.1/8.4.0 等でも再現）で、app: 属性を一切使わない構成に変更して解決した
# （詳細は各レイアウト/build.gradle のコメントを参照）。
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      # flutter_confirm/.android は .gitignore 対象（Flutter が自動生成するエフェメラルな
      # ディレクトリのため）。settings.gradle がここを include_flutter.groovy で直接参照するので、
      # ビルド前に `flutter pub get` で再生成する。
      - name: flutter pub get (flutter_confirm)
        run: flutter pub get
        working-directory: flutter_confirm

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
